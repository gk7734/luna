<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#2b3170"/>
      <stop offset="0.55" stop-color="#151a43"/>
      <stop offset="1" stop-color="#0a0c22"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe7a8" stop-opacity="0.16"/>
      <stop offset="0.7" stop-color="#ffd27a" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="moon" x1="0.15" y1="0.1" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#fff8e1"/>
      <stop offset="0.55" stop-color="#ffe2a0"/>
      <stop offset="1" stop-color="#f4b860"/>
    </linearGradient>
    <linearGradient id="caret" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fe3ff"/>
      <stop offset="1" stop-color="#5aa8ff"/>
    </linearGradient>
    <mask id="crescent">
      <rect width="1024" height="1024" fill="black"/>
      <circle cx="470" cy="520" r="250" fill="white"/>
      <circle cx="590" cy="440" r="215" fill="black"/>
    </mask>
    <clipPath id="tile">
      <rect x="100" y="100" width="824" height="824" rx="185" ry="185"/>
    </clipPath>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#sky)"/>
  </g>
  <g clip-path="url(#tile)">
    <g fill="#ffffff">
      <circle cx="250" cy="250" r="5" opacity="0.85"/>
      <circle cx="770" cy="215" r="4" opacity="0.7"/>
      <circle cx="805" cy="420" r="3" opacity="0.6"/>
      <circle cx="205" cy="455" r="3" opacity="0.55"/>
      <circle cx="330" cy="780" r="4" opacity="0.6"/>
      <circle cx="840" cy="760" r="3" opacity="0.5"/>
      <circle cx="610" cy="185" r="3" opacity="0.6"/>
    </g>
    <circle cx="380" cy="600" r="340" fill="url(#halo)"/>
    <rect x="0" y="0" width="1024" height="1024" fill="url(#moon)" mask="url(#crescent)"/>
    <rect x="748" y="440" width="34" height="250" rx="17" fill="url(#caret)"/>
  </g>
  <rect x="100.5" y="100.5" width="823" height="823" rx="185" ry="185" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
</svg>
